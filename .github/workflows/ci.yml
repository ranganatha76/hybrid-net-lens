name: Go checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: false
      - run: make check
      - run: make security
      - run: go test -coverprofile=coverage.out ./...
      - run: make build VERSION=${{ github.sha }}
      - run: go run ./cmd/hybrid-net-lens validate -config config.example.json
      - run: make image VERSION=${{ github.sha }} IMAGE=hybrid-net-lens:ci
      - run: make image-security IMAGE=hybrid-net-lens:ci
      - run: make integration IMAGE=hybrid-net-lens:ci
      - run: go install sigs.k8s.io/kind@v0.27.0
      - run: make cluster-check IMAGE=hybrid-net-lens:ci